# Builds a DEBUG OR-Nav APK in the cloud, for the emulator (x86_64) and Sean's real phone (arm64).
# Why the cloud: on Sean's Windows PC the C++ build makes file paths longer than 260 characters.
# Manual only. Never published to Releases. Signed with the public debug key, so it cannot update a real install.
# The JavaScript is packed inside, so the app runs on a phone with no PC. When Metro is reachable
# (emulator with adb reverse tcp:8081 tcp:8081), the app loads live code from Metro instead.
name: Debug APK (test phone)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # Expo SDK 58 needs Node 22.13 or newer
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Write Supabase settings (.env)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then echo "Supabase secrets are missing"; exit 1; fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env

      - name: Pack the JavaScript into the APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --entry-file index.ts --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build debug APK (phone and emulator)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Keep APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: or-nav-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
