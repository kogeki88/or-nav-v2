# Builds a DEBUG OR-Nav APK for the test phone (Android emulator, x86_64) in the cloud.
# Why the cloud: on Sean's Windows PC the C++ build makes file paths longer than 260 characters.
# Manual only. Never published to Releases. Signed with the public debug key, so it cannot update a real install.
# The debug app has no JavaScript inside: it loads it from Metro on the PC (adb reverse tcp:8081 tcp:8081).
name: Debug APK (test phone)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # Expo SDK 58 needs Node 22.13 or newer
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Build debug APK (phone and emulator)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Keep APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: or-nav-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
