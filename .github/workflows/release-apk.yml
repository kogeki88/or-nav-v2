# Builds the signed OR-Nav APK in the cloud and publishes it to GitHub Releases.
# A tag like v2.0.1 sets the app version to 2.0.1; the run number sets the build number.
name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # Expo SDK 58 needs Node 22.13 or newer
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ornav-release.keystore

      - name: Set version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "ORNAV_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi
          echo "ORNAV_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ORNAV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORNAV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORNAV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk or-nav.apk

      - name: Remove signing key
        if: always()
        run: rm -f android/app/ornav-release.keystore

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: or-nav.apk
          make_latest: true

      - name: Keep APK as run artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: or-nav-apk
          path: or-nav.apk
